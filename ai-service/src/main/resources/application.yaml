server:
  port: 9090

spring:
  application:
    name: ai-service

  # 上传文件大小上限。默认 1MB 对 PDF 太紧（实测那份售后政策 337KB 没事，
  # 但扫描件 PDF 动辄 5-10MB）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # 把 .env 当成 properties 载入（KEY=VALUE 格式兼容）。
  # optional: 前缀保证 .env 不存在时也能启动，不报 FileNotFound。
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # 启动时不去连库：建库脚本还没跑的时候也能先把服务拉起来
      initialization-fail-timeout: -1

  cloud:
    openfeign:
      client:
        config:
          default:
            # 调 mall 的超时：连接 1s、读取 3s，超时即视为工具失败（见 docs-architecture 4.3）
            connect-timeout: 1000
            read-timeout: 3000
            # basic 会打印「方法 URL 状态码 耗时」，联调第 1 步时最有用
            logger-level: basic

  # ===== Spring AI =====
  ai:
    openai:
      # 阿里云百炼 MaaS 的 OpenAI 兼容入口。凭据只从 .env 读，不写死在这里。
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          # 实测维度 1024
          model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
      chat:
        options:
          # 实测过 function calling：qwen3.8-flash 返回的 arguments 不是合法 JSON，
          # qwen3.7-plus / qwen3.7-max / deepseek-v4.1-flash 正常
          model: ${CHAT_MODEL:qwen3.7-plus}
          # 事实型问答温度要低，高了开始编
          temperature: 0.2

    vectorstore:
      redis:
        # 索引名和旧原型留下的 lee-vectorstore 分开，避免互相干扰
        index-name: kb-vectorstore
        # 前缀刻意不用 embedding:，和旧索引（JSON 类型 + embedding: 前缀）彻底错开
        # 结尾的冒号是值的一部分，必须加引号，否则 SnakeYAML 会当成映射的冒号
        prefix: "kb:embedding:"
        # 首次启动自动 FT.CREATE 建索引
        initialize-schema: true
        # 注意：这里没有「维度」配置项。Spring AI 的 AbstractEmbeddingModel.dimensions()
        # 会在建索引时探测维度——先查内置模型维度表，查不到就真的调一次 embedding 接口量长度，
        # 实测本模型返回 1024，索引会按 1024 建。所以换 embedding 模型后
        # 必须 FT.DROPINDEX 重建，否则新旧维度不一致，写入时才报错。

  # ===== Redis Stack（向量库，端口 9379）=====
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# hmall 服务地址。第 1 步用 url 直连，不接 Nacos（Nacos 在课程虚拟机上，起不来就没有 hmall）。
# 端口以实测为准：item-service 实际监听 8081（application.yaml 覆盖了 bootstrap.yaml 里的 8082），
# 启动日志：Tomcat started on port(s): 8081。
hmall:
  item-service:
    url: ${HMALL_ITEM_URL:http://127.0.0.1:8081}
  trade-service:
    url: ${HMALL_TRADE_URL:http://127.0.0.1:8085}

# ===== 知识入库参数 =====
# 切分参数在第 8 步要用评测集扫，先给一个保守起点。
# 实测依据：商品目录 128 字符/款 → 500 字约 3-4 款/块；售后政策归一化后约 9000 字 → 约 20 块/份
ai:
  ingest:
    chunk-size: 500
    overlap: 80
    # 一次 add 太多会被上游 embedding 接口限流，20 是实测能稳定通过的批次
    embed-batch-size: 20
    # 同一份文档的入库锁；正常入库远小于 60s，给足余量防长时间 embedding 超时
    lock-ttl-seconds: 60

  # ===== 检索参数 =====
  # 阈值必须靠评测集定，不能拍。找答案的做法是先用 /dev/probe/kb/sweep 看不同阈值下的命中数，
  # 再挑「召回开始掉、但仍能命中目标段落」的那一档。
  rag:
    top-k: 5
    similarity-threshold: 0.4
    # 拼进提示词的片段数上限（防止 topK 调大后上下文爆掉）
    max-context-chunks: 5
    # 过滤表格流水句等噪声片段；多取 fetch-multiplier 倍候选再截断
    filter-fragments: true
    fetch-multiplier: 2
    # 噪声判定：短于该长度、或含 ≥ 阈值个「是/否」token（决策矩阵被抽散的特征）
    min-chunk-chars: 50
    yes-no-token-threshold: 3

logging:
  level:
    com.mall.ai.client: DEBUG
